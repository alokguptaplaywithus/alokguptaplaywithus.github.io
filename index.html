<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Blaster</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,6,15,.82);color:#fff;text-align:center;padding:24px;gap:10px}
  .overlay.hidden{display:none}
  h1{margin:0;font-size:42px;letter-spacing:3px;color:#5ef2ff;text-shadow:0 0 18px #19b7ff}
  p{margin:0;color:#b8c3ff;font-size:16px}
  button{margin-top:14px;padding:14px 38px;font-size:20px;font-weight:700;border:0;border-radius:40px;
    color:#05060f;background:linear-gradient(90deg,#5ef2ff,#7b8cff);box-shadow:0 0 20px #5ef2ff88}
  button:active{transform:scale(.96)}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;
    color:#fff;font-weight:700;pointer-events:none;text-shadow:0 0 8px #000;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">Score 0</span><span id="level">Level 1</span><span id="lives">♥♥♥</span></div>

<div id="menu" class="overlay">
  <h1>SPACE BLASTER</h1>
  <p>Drag to move. Ship fires automatically.</p>
  <p>Collect power-ups. Survive the waves.</p>
  <p id="best">Best: 0</p>
  <button id="play">PLAY</button>
</div>

<div id="over" class="overlay hidden">
  <h1 style="color:#ff6b8a;text-shadow:0 0 18px #ff2d55">GAME OVER</h1>
  <p id="final"></p>
  <p id="best2"></p>
  <button id="again">PLAY AGAIN</button>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
const store = {
  get(){ try{ return +localStorage.getItem('sb_best') || 0 }catch(e){ return 0 } },
  set(v){ try{ localStorage.setItem('sb_best', v) }catch(e){} }
};

// ---- Audio (tiny WebAudio beeps, no assets needed) ----
let actx = null;
function beep(freq, dur, type='square', vol=.05){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

// ---- State ----
let state = 'menu';
let player, bullets, enemies, ebullets, particles, powerups, stars;
let score, level, lives, spawnT, fireT, shake, kills, boss;
const input = { x: 0, active: false };

function initStars(){
  stars = Array.from({length: 70}, () => ({
    x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+.5, v: Math.random()*60+20
  }));
}
initStars();

function reset(){
  player = { x: W/2, y: H*0.82, r: 18, inv: 0, power: 1, powerT: 0, shield: 0 };
  input.x = player.x;
  bullets = []; enemies = []; ebullets = []; particles = []; powerups = [];
  score = 0; level = 1; lives = 3; spawnT = 0; fireT = 0; shake = 0; kills = 0; boss = null;
  updateHud();
}

function updateHud(){
  $('score').textContent = 'Score ' + score;
  $('level').textContent = 'Level ' + level;
  $('lives').textContent = '♥'.repeat(Math.max(lives,0));
}

// ---- Input ----
function pointerX(e){
  const t = e.touches ? e.touches[0] : e;
  return t.clientX;
}
function down(e){ input.active = true; input.x = pointerX(e); e.preventDefault(); }
function move(e){ if(input.active){ input.x = pointerX(e); } e.preventDefault(); }
function up(e){ input.active = false; }
cv.addEventListener('touchstart', down, {passive:false});
cv.addEventListener('touchmove', move, {passive:false});
cv.addEventListener('touchend', up);
cv.addEventListener('mousedown', down);
window.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// ---- Spawning ----
function spawnEnemy(){
  const t = Math.random();
  const e = { x: Math.random()*(W-60)+30, y: -30, r: 16, vy: 60 + level*8 + Math.random()*40,
              hp: 1, kind: 0, t: Math.random()*6, shoot: 2 + Math.random()*3 };
  if(t > .7){ e.kind = 1; e.hp = 2; e.r = 20; e.vy *= .8; }          // tank
  if(t > .9 && level >= 2){ e.kind = 2; e.hp = 1; e.r = 14; e.vy *= 1.3; } // zigzag fast
  enemies.push(e);
}
function spawnBoss(){
  boss = { x: W/2, y: -80, r: 46, hp: 30 + level*10, max: 30 + level*10, dir: 1, shoot: 1, enter: true };
}
function burst(x, y, color, n=14){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = Math.random()*160+40;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: .6+Math.random()*.4, color });
  }
}
function dropPower(x, y){
  const r = Math.random();
  if(r < .12) powerups.push({ x, y, kind: 'power', r: 12 });
  else if(r < .18) powerups.push({ x, y, kind: 'shield', r: 12 });
  else if(r < .21 && lives < 5) powerups.push({ x, y, kind: 'life', r: 12 });
}

// ---- Update ----
function hurt(){
  if(player.inv > 0) return;
  if(player.shield > 0){ player.shield = 0; player.inv = 1; beep(300, .15, 'sine'); return; }
  lives--; player.inv = 2; shake = .35; player.power = 1;
  burst(player.x, player.y, '#ff6b8a', 24); beep(120, .3, 'sawtooth', .08);
  updateHud();
  if(lives <= 0) gameOver();
}

function update(dt){
  // stars
  for(const s of stars){ s.y += s.v*dt; if(s.y > H){ s.y = 0; s.x = Math.random()*W; } }
  if(state !== 'play') return;

  // player movement
  if(keys['ArrowLeft'] || keys['a']) input.x -= 400*dt;
  if(keys['ArrowRight'] || keys['d']) input.x += 400*dt;
  input.x = Math.max(player.r, Math.min(W-player.r, input.x));
  player.x += (input.x - player.x) * Math.min(1, dt*14);
  player.inv = Math.max(0, player.inv - dt);
  if(player.powerT > 0){ player.powerT -= dt; if(player.powerT <= 0) player.power = 1; }

  // auto fire
  fireT -= dt;
  if(fireT <= 0){
    fireT = .22;
    const p = player.power;
    const offs = p === 1 ? [0] : p === 2 ? [-8, 8] : [-14, 0, 14];
    for(const o of offs) bullets.push({ x: player.x + o, y: player.y - 20, vy: -620, r: 4 });
    beep(880, .04, 'square', .015);
  }

  // spawn
  spawnT -= dt;
  if(!boss && spawnT <= 0){
    spawnT = Math.max(.35, 1.1 - level*.07);
    spawnEnemy();
  }
  if(!boss && kills >= level*12){ spawnBoss(); }

  // bullets
  for(const b of bullets) b.y += b.vy*dt;
  bullets = bullets.filter(b => b.y > -20);

  // enemies
  for(const e of enemies){
    e.t += dt;
    e.y += e.vy*dt;
    if(e.kind === 2) e.x += Math.sin(e.t*5)*140*dt;
    e.shoot -= dt;
    if(e.shoot <= 0 && e.y > 0 && e.y < H*.6){
      e.shoot = 2.5 + Math.random()*2.5 - Math.min(level*.1, 1.2);
      if(level >= 2 && e.kind !== 2) ebullets.push({ x: e.x, y: e.y + 12, vx: 0, vy: 220 + level*10, r: 5 });
    }
  }
  // boss
  if(boss){
    if(boss.enter){ boss.y += 70*dt; if(boss.y >= 110) boss.enter = false; }
    else {
      boss.x += boss.dir * 110 * dt;
      if(boss.x > W-boss.r || boss.x < boss.r) boss.dir *= -1;
      boss.shoot -= dt;
      if(boss.shoot <= 0){
        boss.shoot = Math.max(.5, 1.1 - level*.05);
        for(let i=-2;i<=2;i++) ebullets.push({ x: boss.x, y: boss.y+30, vx: i*60, vy: 230, r: 6 });
        beep(200, .12, 'sawtooth', .04);
      }
    }
  }
  for(const b of ebullets){ b.x += (b.vx||0)*dt; b.y += b.vy*dt; }
  ebullets = ebullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);

  // bullet vs enemy
  for(const b of bullets){
    for(const e of enemies){
      if(e.hp > 0 && dist(b,e) < e.r + b.r){
        e.hp--; b.y = -999;
        if(e.hp <= 0){
          score += e.kind === 1 ? 30 : 10; kills++;
          burst(e.x, e.y, e.kind===1 ? '#ffb84d' : '#ff6b8a'); beep(200, .1, 'sawtooth', .03);
          dropPower(e.x, e.y);
          updateHud();
        } else beep(400, .05);
      }
    }
    if(boss && !boss.enter && dist(b, boss) < boss.r + b.r){
      boss.hp--; b.y = -999; burst(b.x, b.y, '#fff', 3);
      if(boss.hp <= 0){
        score += 200 + level*50; burst(boss.x, boss.y, '#ffd24d', 60); shake = .6;
        beep(100, .5, 'sawtooth', .09);
        for(let i=0;i<3;i++) powerups.push({ x: boss.x + (i-1)*30, y: boss.y, kind: i===0?'power':i===1?'shield':'life', r: 12 });
        boss = null; level++; kills = 0; spawnT = 2; updateHud();
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.y < H+40);

  // enemy hits player
  for(const e of enemies){ if(dist(e, player) < e.r + player.r - 4){ e.hp = 0; burst(e.x, e.y, '#ff6b8a'); hurt(); } }
  for(const b of ebullets){ if(dist(b, player) < b.r + player.r - 6){ b.y = H+99; hurt(); } }
  if(boss && dist(boss, player) < boss.r + player.r) hurt();

  // powerups
  for(const p of powerups){
    p.y += 90*dt;
    if(dist(p, player) < p.r + player.r + 4){
      p.y = H+99; beep(1200, .12, 'sine', .05);
      if(p.kind === 'power'){ player.power = Math.min(3, player.power+1); player.powerT = 10; }
      if(p.kind === 'shield') player.shield = 1;
      if(p.kind === 'life'){ lives = Math.min(5, lives+1); updateHud(); }
    }
  }
  powerups = powerups.filter(p => p.y < H+30);

  // particles
  for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// ---- Draw ----
function drawShip(x, y, r, color, flip){
  ctx.save(); ctx.translate(x, y); if(flip) ctx.scale(1,-1);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*.85, r*.8); ctx.lineTo(0, r*.4); ctx.lineTo(-r*.85, r*.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.fillStyle = '#05060f'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-.5)*10, (Math.random()-.5)*10);

  ctx.fillStyle = '#fff';
  for(const s of stars){ ctx.globalAlpha = .3 + s.s/3; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if(state === 'play' || state === 'over'){
    // player
    if(lives > 0 && !(player.inv > 0 && Math.floor(player.inv*10)%2)){
      drawShip(player.x, player.y, player.r, '#5ef2ff', false);
      if(player.shield){ ctx.strokeStyle = '#7b8cff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x, player.y, player.r+8, 0, 6.283); ctx.stroke(); }
    }
    // bullets
    ctx.fillStyle = '#fff59a'; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 10;
    for(const b of bullets){ ctx.fillRect(b.x-2, b.y-8, 4, 14); }
    ctx.fillStyle = '#ff9f6b'; ctx.shadowColor = '#ff6b3d';
    for(const b of ebullets){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill(); }
    ctx.shadowBlur = 0;
    // enemies
    for(const e of enemies){ drawShip(e.x, e.y, e.r, e.kind===1 ? '#ffb84d' : e.kind===2 ? '#c06bff' : '#ff6b8a', true); }
    // boss
    if(boss){
      drawShip(boss.x, boss.y, boss.r, '#ff3d6b', true);
      ctx.fillStyle = '#222'; ctx.fillRect(W*.2, 62, W*.6, 8);
      ctx.fillStyle = '#ff3d6b'; ctx.fillRect(W*.2, 62, W*.6*Math.max(0, boss.hp/boss.max), 8);
    }
    // powerups
    for(const p of powerups){
      const c = p.kind==='power' ? '#ffd24d' : p.kind==='shield' ? '#7b8cff' : '#6bff9c';
      ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#05060f'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.kind==='power' ? 'P' : p.kind==='shield' ? 'S' : '+', p.x, p.y+1);
    }
    // particles
    for(const p of particles){ ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ---- Game flow ----
function start(){
  reset(); state = 'play';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  $('hud').style.display = 'flex';
  beep(600, .1);
}
function gameOver(){
  state = 'over';
  const best = Math.max(store.get(), score); store.set(best);
  $('final').textContent = 'Score: ' + score + '  •  Level ' + level;
  $('best2').textContent = 'Best: ' + best;
  setTimeout(() => $('over').classList.remove('hidden'), 700);
}
$('play').onclick = start; $('again').onclick = start;
$('best').textContent = 'Best: ' + store.get();
$('hud').style.display = 'none';

let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now-last)/1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
